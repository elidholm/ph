---
name: CI

on:
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown lint (markdownlint-cli2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: '**/*.md'

  shell-lint:
    name: Shell lint (shellcheck + shfmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'

      - name: Run shfmt
        uses: collin-miller/shfmt-action@v1
        with:
          args: -d -i 2 ./ph

  actions-lint:
    name: GitHub Actions lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        id: actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: false
          flags: "-ignore SC2242"

      - name: Actionlint Summary
        if: ${{ steps.actionlint.outputs.exit-code != 0 }}
        run: |
          echo "Used actionlint version ${{ steps.actionlint.outputs.version-semver }}"
          echo "Used actionlint release ${{ steps.actionlint.outputs.version-tag }}"
          echo "actionlint ended with ${{ steps.actionlint.outputs.exit-code }} exit code"
          echo "actionlint ended because '${{ steps.actionlint.outputs.exit-message }}'"
          echo "actionlint found ${{ steps.actionlint.outputs.total-errors }} errors"
          echo "actionlint checked ${{ steps.actionlint.outputs.total-files }} files"
          echo "actionlint cache used: ${{ steps.actionlint.outputs.cache-hit }}"
          exit ${{ steps.actionlint.outputs.exit-code }}

  bats-test:
    name: Bats test suite (bats-core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bats and bats libs
        id: setup-bats
        uses: bats-core/bats-action@4.0.0

      - name: Run Bats tests
        shell: bash
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
          TERM: xterm
        run: bats tests/unit

  smoke-test:
    name: Pi-hole smoke tests (Docker)
    runs-on: ubuntu-latest
    services:
      pihole:
        image: pihole/pihole:latest
        ports:
          - 8080:80
        env:
          TZ: 'UTC'
          FTLCONF_webserver_api_password: 'ci-smoke-test-password'
          FTLCONF_dns_listeningMode: 'ALL'
    env:
      PIHOLE_API_URL: 'http://localhost:8080/api'
      PIHOLE_API_KEY: 'ci-smoke-test-password'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bats and bats libs
        id: setup-bats
        uses: bats-core/bats-action@4.0.0

      - name: Wait for Pi-hole API to become ready
        shell: bash
        run: |
          for _ in $(seq 1 30); do
            if curl --silent --output /dev/null "${PIHOLE_API_URL}"; then
              echo 'Pi-hole API is ready.'
              exit 0
            fi
            sleep 2
          done
          echo 'Pi-hole API did not become ready in time.' >&2
          exit 1

      - name: Run Pi-hole smoke tests
        shell: bash
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
          TERM: xterm
        run: bats tests/smoke
